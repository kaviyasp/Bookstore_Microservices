server:
  port: 8082

spring:
  application:
    name: admin-service
  datasource:
    url: jdbc:postgresql://localhost:5433/admin_db?TimeZone=Asia/Kolkata
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: bookstore-super-secret-key-must-be-long-enough-256bits
  expiry: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.bookstore.admin